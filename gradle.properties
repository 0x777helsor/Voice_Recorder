org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.defaults.buildfeatures.resvalues=true

kotlin.code.style=official

# SafeSignal must never ship a build that logs secrets or trusts user-supplied
# cleartext traffic. These flags are deliberately strict.
android.enableJetifier=false